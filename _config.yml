# Site settings. Change these freely.
title: Generative Lab
tagline: a faculty initiative at Lawrence University
description: >-
  A space for faculty and students in mathematics, statistics, computer science,
  and data science to make things. A makerspace for science.
url: https://lu-generative-lab.github.io
baseurl: ""
repo: https://github.com/LU-Generative-Lab/lu-generative-lab.github.io

# Content lives in these two folders. One Markdown file per person or project.
collections:
  people:
    output: false
  projects:
    output: false

markdown: kramdown
kramdown:
  input: GFM

exclude: [README.md, Gemfile, Gemfile.lock, vendor]

# Raspberry Pi Lending Library form (resources/pi-library/).
# endpoint: a form service URL (e.g. Formspree) that emails submissions.
# Leave it empty and the form opens the student's email app instead,
# addressed to mail_user@mail_domain.
pi_library:
  endpoint: ""
  mail_user: acacia.ackles
  mail_domain: lawrence.edu
